<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>なんびょう？ ストップウォッチクイズ</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:manipulation}body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#10233d;color:white}.app{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(22px)}header{font-size:clamp(22px,3.4vw,42px);font-weight:900;letter-spacing:.05em;text-align:center}.center{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;width:100%}.status{font-size:clamp(18px,2.4vw,28px);color:#c6ddf8;font-weight:700}.display{font-size:clamp(65px,15vw,190px);line-height:1.08;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:center}.display.hidden{letter-spacing:.12em}.hint{font-size:clamp(16px,2vw,24px);color:#b7c9df;text-align:center;min-height:1.5em}.controls{width:min(100%,1100px);display:flex;gap:16px;padding-bottom:5px}button{border:0;border-radius:22px;padding:clamp(14px,3vh,26px) 12px;font-size:clamp(22px,3vw,36px);font-weight:900;flex:1;color:white;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.38;cursor:default}.start{background:#20a66a}.stop{background:#e65b53}.answer{background:#357ce5}.reset{background:#53677e}button:active:not(:disabled){filter:brightness(1.15)}@media(orientation:portrait){.app:before{content:'iPadを よこむきに してね';position:absolute;inset:0;background:#10233d;z-index:10;display:flex;align-items:center;justify-content:center;font-size:8vw;font-weight:900;text-align:center;padding:20px}}@media(max-height:430px){header{font-size:24px}.display{font-size:min(15vw,110px)}.controls button{padding:12px}.app{padding-top:8px;padding-bottom:8px}}</style></head><body><main class="app"><header>⏱️ なんびょう たったかな？</header><section class="center"><div class="status" id="status">じゅんび OK！</div><div class="display hidden" id="display">？？？</div><div class="hint" id="hint">スタートを おしてね</div></section><nav class="controls"><button class="start" id="start">スタート</button><button class="stop" id="stop" disabled>ストップ</button><button class="answer" id="answer" disabled>こたえを みる</button><button class="reset" id="reset">もういちど</button></nav></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),start=$('start'),stop=$('stop'),answer=$('answer'),reset=$('reset'),display=$('display'),status=$('status'),hint=$('hint');let begun=0,elapsed=0,phase='ready';function update(){start.disabled=phase!=='ready';stop.disabled=phase!=='running';answer.disabled=phase!=='stopped';display.classList.toggle('hidden',phase!=='revealed');if(phase==='ready'){status.textContent='じゅんび OK！';display.textContent='？？？';hint.textContent='スタートを おしてね'}else if(phase==='running'){status.textContent='けいそく ちゅう！';display.textContent='？？？';hint.textContent='なんびょう たったかな？'}else if(phase==='stopped'){status.textContent='ストップ！';display.textContent='？？？';hint.textContent='なんびょう だったか よそうしてね'}else{status.textContent='せいかい は…';display.textContent=(elapsed/1000).toFixed(2)+'秒';hint.textContent='もういちど ちょうせんしよう！'}}start.addEventListener('click',()=>{if(phase!=='ready')return;begun=performance.now();phase='running';update()});stop.addEventListener('click',()=>{if(phase!=='running')return;elapsed=performance.now()-begun;phase='stopped';update()});answer.addEventListener('click',()=>{if(phase!=='stopped')return;phase='revealed';update()});reset.addEventListener('click',()=>{phase='ready';elapsed=0;update()});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});let lastTouch=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouch<300)e.preventDefault();lastTouch=now},{passive:false});update()})();</script></body></html>

<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>なんびょう？ ストップウォッチクイズ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;width:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#10233d;color:#fff;user-select:none;-webkit-user-select:none}.app{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(24px);text-align:center;gap:clamp(8px,2vh,20px)}header{font-weight:900;font-size:clamp(23px,3.5vw,44px)}.middle{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(9px,2vh,20px)}.main-button{height:min(50vh,270px);width:min(50vh,270px);min-height:145px;min-width:145px;border:0;border-radius:50%;background:#17a568;color:white;font-weight:900;font-size:clamp(28px,4.8vw,51px);box-shadow:0 12px 0 #0a6944,0 18px 35px #071729;cursor:pointer;touch-action:manipulation}.main-button:active{transform:translateY(5px);box-shadow:0 7px 0 #0a6944}.message{font-size:clamp(22px,3.4vw,43px);font-weight:900}.timer{font-size:clamp(60px,12vw,160px);font-weight:900;line-height:1.06;font-variant-numeric:tabular-nums;white-space:nowrap}.helper{font-size:clamp(19px,2.7vw,33px);color:#c8e3ff;font-weight:700}.restart{background:#397ddd;border:0;color:white;border-radius:22px;padding:13px 38px;font-size:clamp(20px,2.5vw,30px);font-weight:850;cursor:pointer}.running{cursor:pointer}.running .middle{background:rgba(255,255,255,.035);border-radius:32px}.running .helper{color:#f9df8d}.app[data-phase="ready"] .timer,.app[data-phase="ready"] .restart,.app[data-phase="running"] .restart,.app[data-phase="running"] .main-button,.app[data-phase="revealed"] .main-button{display:none}.app[data-phase="ready"] .main-button{display:block}.app[data-phase="revealed"] .timer{color:#f9df8d}@media(orientation:portrait){body:before{content:'iPadを よこむきに してね';position:fixed;inset:0;background:#10233d;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;font-size:8vw;font-weight:900;text-align:center}}@media(max-height:390px){.app{gap:4px}header{font-size:21px}.main-button{height:140px;width:140px;min-height:140px;min-width:140px;font-size:26px}.timer{font-size:75px}.helper{font-size:19px}.message{font-size:24px}}
</style></head><body>
<main class="app" id="app" data-phase="ready" aria-label="ストップウォッチクイズ"><header>⏱️ なんびょう たったかな？</header><section class="middle"><div class="message" id="message">じかんを あてよう！</div><button type="button" class="main-button" id="start">スタート</button><div class="timer" id="timer" aria-live="polite">0.00秒</div><div class="helper" id="helper">まんなかの ボタンを おしてね</div></section><button type="button" class="restart" id="restart" hidden>もういちど</button></main>
<script>(()=>{'use strict';const app=document.getElementById('app'),start=document.getElementById('start'),restart=document.getElementById('restart'),message=document.getElementById('message'),timer=document.getElementById('timer'),helper=document.getElementById('helper');let phase='ready',began=0,elapsed=0;function render(){app.dataset.phase=phase;restart.hidden=phase!=='revealed';if(phase==='ready'){message.textContent='じかんを あてよう！';helper.textContent='まんなかの ボタンを おしてね';timer.textContent='0.00秒'}else if(phase==='running'){message.textContent='けいそく ちゅう！';helper.textContent='がめんの どこでも タップで ストップ！';timer.textContent='？？？'}else{message.textContent='こたえは…';timer.textContent=(elapsed/1000).toFixed(2)+'秒';helper.textContent='なんびょう だったか あたったかな？'}}start.addEventListener('click',e=>{e.stopPropagation();if(phase!=='ready')return;began=performance.now();phase='running';render()});app.addEventListener('click',()=>{if(phase!=='running')return;elapsed=performance.now()-began;phase='revealed';render()});restart.addEventListener('click',e=>{e.stopPropagation();elapsed=0;phase='ready';render()});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});let touchAt=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-touchAt<300)e.preventDefault();touchAt=now},{passive:false});render()})();</script></body></html>
